org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental caches break when the project (F:) and the pub cache (C:) are on different drives on Windows.
kotlin.incremental=false
# Compile Kotlin inside the Gradle daemon instead of a second large JVM.
kotlin.compiler.execution.strategy=in-process
