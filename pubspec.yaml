name: flutter_app_scaffold
description: "OHS Mobile — the mobile app of the Occupational Health and Safety regulatory platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.2.0
  provider: ^6.0.5
  dio: ^5.3.2
  flutter_secure_storage: ^8.0.0
  url_launcher: ^6.3.2
  file_picker: ^10.2.0
  table_calendar: ^3.0.8
  intl: ^0.18.1
  open_filex: 4.7.0
  fl_chart: ^0.68.0
  timeago: ^3.6.0
  uuid: ^4.3.3
  image_picker: ^1.0.8
  shared_preferences: ^2.0.12
  path_provider: ^2.1.0
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^2.24.2
  flutter_local_notifications: ^22.3.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  

flutter_native_splash:
  color: "#07111f"
  image: assets/logo.jpg
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/docs/
    - assets/images/
    - assets/logo.jpg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.jpg"
  min_sdk_android: 21 